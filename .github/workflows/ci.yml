
name: Linux Health Check CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
   # runs-on: ubuntu-latest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Bash Syntax
        run: bash -n devops-lab/lesson01/healthcheck.sh

      - name: Check Script Permission
        run: test -x devops-lab/lesson01/healthcheck.sh

      - name: Run Health Check
        run: bash devops-lab/lesson01/healthcheck.sh
